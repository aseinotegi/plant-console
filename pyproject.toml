[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-console"
version = "1.0.0"
description = "Web console for a Unified Namespace plant: the robot on a 2D map, the PLC, the namespace, the rules and the vision results"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ander Sein Otegui", email = "aseinotegi@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
]
keywords = ["uns", "unified-namespace", "mqtt", "iiot", "scada", "hmi", "fastapi", "react"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
plant-console = "plant_console.app:main"

[project.urls]
Homepage = "https://andersein.com"
Source = "https://github.com/aseinotegi/plant-console"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
